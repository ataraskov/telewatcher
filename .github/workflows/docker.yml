name: Build and publish Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One run at a time per ref, so two pushes cannot pick the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the version tag
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so the version can be derived

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # A tag event, or a re-run of an already versioned commit, keeps its version.
          existing="$(git tag --points-at HEAD --sort=-v:refname | grep -E "$semver" | head -n1 || true)"
          if [ -n "$existing" ]; then
            version="$existing"
            tag_needed=false
          else
            latest="$(git tag --sort=-v:refname | grep -E "$semver" | head -n1 || true)"
            if [ -z "$latest" ]; then
              version="v0.1.0"
            else
              core="${latest#v}"
              major="${core%%.*}"
              minor="$(printf '%s' "$core" | cut -d. -f2)"
              patch="$(printf '%s' "$core" | cut -d. -f3)"
              version="v${major}.${minor}.$((patch + 1))"
            fi
            tag_needed=true
          fi

          core="${version#v}"
          {
            echo "version=$version"
            echo "docker_version=$core"
            echo "docker_minor=${core%.*}"
            echo "tag_needed=$tag_needed"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version (new tag needed: $tag_needed)"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.docker_version }}
            type=raw,value=${{ steps.version.outputs.docker_minor }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.docker_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tagged only after a successful build, so a failed run does not burn a
      # version number. Pushing with GITHUB_TOKEN does not re-trigger this
      # workflow, so the new tag cannot cause a second build.
      - name: Tag the commit
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/heads/')
          && steps.version.outputs.tag_needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
